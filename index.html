<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ROWAR · 로봇 배틀 프로토타입</title>
<link rel="stylesheet" href="style.css?v=20260918-preset">
<link rel="stylesheet" href="themes/scenes.css?v=20260918-preset">
</head>
<body data-scene="hangar">
<!-- 화면별 배경 연출 레이어. 전부 pointer-events:none 이라 조작을 막지 않는다 -->
<div id="fx" aria-hidden="true"></div>

<!-- 대문. 게임 화면이 바로 뜨지 않게 한 겹 둔다. 시작을 누르면 사라진다. -->
<div id="gate">
  <div class="gate-inner">
    <div class="gate-logo">ROWAR<span>ROBOT · WAR</span></div>
    <p class="gate-tag">기체를 뽑고, 정비하고, 내보낸다.</p>

    <div class="gate-who" id="gate-who">연결 중…</div>

    <button class="btn big gold gate-start" id="gate-start">시작하기</button>

    <!-- 로그인 칸을 대문에 그대로 둔다. 예전에는 '계정 · 로그인' 을 눌러 창을 띄워야
         입력칸이 나왔다 — 이미 계정이 있는 사람이 매번 한 번 더 눌러야 했다.
         계정이 있는 사람은 여기서 바로 들어가고, 없는 사람은 아래 링크로 만든다. -->
    <form class="gate-login" id="gate-login" autocomplete="on">
      <input class="ainput" id="gate-id" placeholder="아이디" maxlength="20" autocomplete="username">
      <input class="ainput" id="gate-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn gate-in" id="gate-in" type="submit">로그인</button>
    </form>

    <button class="btn ghost gate-acct" id="gate-acct">계정 만들기 · 관리</button>

    <div class="gate-foot">
      <a href="#" class="gate-help" onclick="ROWAR.guide();return false">게임 설명 보기</a>
      <span class="dot">·</span>
      <span>진행 상황은 서버에 저장됩니다</span>
    </div>
  </div>
</div>
<div id="app">
  <header class="topbar">
    <div class="brand">ROWAR<small>ROBOT · WAR</small></div>
    <div class="wallet">
      <span class="coin" data-tip="크레딧 · 레벨업과 정비에 사용" title="크레딧"><i class="ic ic-credit"></i><b id="w-credit">0</b></span>
      <span class="coin" data-tip="코어 · 뽑기 1회에 1개" title="코어"><i class="ic ic-core"></i><b id="w-core">0</b></span>
      <span class="coin" data-tip="스크랩 · 파츠 강화에 사용" title="스크랩"><i class="ic ic-scrap"></i><b id="w-scrap">0</b></span>
      <span class="coin acct" id="acct" data-tip="확인 중">···</span>
      <button class="coin help" id="helpbtn" data-tip="게임 설명" title="게임 설명"
        onclick="ROWAR.guide()">?</button>
    </div>
  </header>

  <nav class="nav">
    <!-- 데스크톱에서는 이 nav 가 왼쪽 세로 레일이 된다(style.css 의 900px 이상 규칙).
         모바일에서는 지금처럼 상단 가로 탭 그대로다. DOM 은 하나만 둔다 —
         둘로 나누면 js 의 [data-s] 바인딩과 active 표시가 두 벌이 된다. -->
    <div class="rlogo">ROWAR</div>
    <button data-s="hangar" class="active"><em>🛠️</em> 격납고</button>
    <button data-s="gacha"><em>🛒</em> 상점</button>
    <button data-s="battle"><em>⚔️</em> 대전</button>
    <button data-s="hunt"><em>🎯</em> 파견</button>
    <button data-s="terr"><em>🗺️</em> 전역</button>
    <button data-s="trial"><em>🔥</em> 시련</button>
    <button data-s="rank"><em>🏆</em> 랭킹</button>
    <div class="rfoot">
      <button class="rhelp" title="게임 설명" onclick="ROWAR.guide()">?</button>
    </div>
  </nav>

  <main>
    <section id="sc-hangar" class="screen active"></section>
    <section id="sc-gacha" class="screen"></section>
    <section id="sc-battle" class="screen"></section>
    <section id="sc-hunt" class="screen"></section>
    <section id="sc-terr" class="screen"></section>
    <section id="sc-trial" class="screen"></section>
    <section id="sc-rank" class="screen"></section>
    <!-- '초기화' 버튼이 있었다. 로컬 저장본만 지우는 버튼이라, 뽑기·전투·격납고가
         서버 판정으로 넘어간 뒤로는 해롭기만 했다 — 누르면 서버가 모르는 기체를 든 채가 되어
         게임이 멈추고, 새로고침하면 서버에서 그대로 되돌아왔다. 지운다. -->
    <div class="panel" style="margin-top:18px">
      <div class="hint">프로토타입 v0.5 · 진행 상황은 서버에 저장됩니다.</div>
    </div>
  </main>

  <!-- 하단 티커. 화면을 옮기지 않아도 '지금 무엇이 익어 가는지' 보인다.
       서버에 묻지 않는다 — 클라가 이미 들고 있는 값만 쓴다. -->
  <div class="ticker" id="ticker"></div>
</div>

<div id="toast" class="toast"></div>
<div id="modal"></div>

<!-- ES 모듈이라 file:// 로 직접 열면 동작하지 않는다. README 의 로컬 서버 안내 참고.
     인라인 onclick="ROWAR.x()" 는 js/game.js 가 window.ROWAR 를 대입하므로 그대로 동작한다. -->
<script type="module" src="js/game.js?v=20260918-preset"></script>
</body>
</html>
