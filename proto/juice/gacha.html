<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROWAR 뽑기 연출 시험대</title>
<!-- 뽑기 등급별 공개 연출 시험 페이지 — 2026-10-08. 게임 화면 파일을 건드리지 않는다. 배포 대상이 아니다.
     로컬: 리포 루트에서 python -m http.server 5181 → http://localhost:5181/proto/juice/gacha.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--ground:#0a0f19;--panel:#111a2a;--panel2:#16223a;--line:#24344f;--ink:#e7eefb;--sub:#8fa2c2;--acc:#56d6ff;--gold:#ffcf5a;
  --num:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 "IBM Plex Sans KR","Segoe UI","맑은 고딕",system-ui,sans-serif;padding:18px 16px 48px}
header{max-width:1200px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
header h1{margin:0;font-size:20px}
header p{margin:0;color:var(--sub);font-size:13px;flex:1 1 320px}
header a{color:var(--acc);font-size:13px}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#05070c;user-select:none}
.cam{position:absolute;inset:0;will-change:transform}
.bg{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:brightness(.55) saturate(.9)}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.tint{position:absolute;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.capsule{position:absolute;left:50%;top:52%;width:22%;transform:translate(-50%,-50%);will-change:transform,filter}
.capsule img{width:100%;display:block}
.robot{position:absolute;left:50%;top:50%;height:72%;transform:translate(-50%,-50%);opacity:0;will-change:transform,filter,opacity}
.robot.flip{transform:translate(-50%,-50%) scaleX(-1)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.card{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none;white-space:nowrap}
.card .r{font-family:var(--num);font-weight:700;letter-spacing:.34em;font-size:clamp(11px,1.6vw,16px)}
.card .n{font-family:var(--num);font-weight:700;font-size:clamp(22px,4.2vw,44px);letter-spacing:.12em;text-shadow:0 3px 0 #000,0 0 24px currentColor}
.card .s{color:var(--sub);font-size:clamp(11px,1.4vw,14px);margin-top:2px}
.stamp{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--num);font-weight:700;letter-spacing:.5em;font-size:clamp(18px,3.4vw,36px);opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 0 22px currentColor,0 2px 0 #000}
.row{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;gap:2%;padding:0 2% 2%;align-items:flex-end;justify-content:center;pointer-events:none}
.mini{flex:1;max-width:10%;aspect-ratio:3/4;border-radius:8px;background:#0b1220cc;border:2px solid var(--c,#456);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:0;transform:translateY(16px) scale(.8);box-shadow:0 0 14px var(--c,#456)}
.mini img{width:86%;max-height:60%;object-fit:contain}
.mini b{font-family:var(--num);font-size:clamp(9px,1.1vw,12px);color:var(--c)}
.hud{position:absolute;left:12px;top:10px;font-size:12px;color:var(--sub)}
.hud b{font-family:var(--num);color:var(--ink)}
.go{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font:inherit;font-weight:700;font-size:15px;padding:12px 28px;border-radius:8px;border:1px solid #2c6f8d;background:linear-gradient(#17506b,#0f3a50);color:#eaf9ff;cursor:pointer;z-index:5}
.go[hidden]{display:none}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px}
aside h2{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.five{grid-template-columns:repeat(5,1fr)}
button.b{font:inherit;font-weight:700;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 6px;cursor:pointer}
button.b:hover{border-color:#3a5480}
button.b.on{border-color:var(--acc);color:var(--acc);background:#0f2a3d}
button.r{border-color:var(--c);color:var(--c)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sl{display:grid;grid-template-columns:80px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.sl input{width:100%;accent-color:var(--acc)}
.sl output{font-family:var(--num);color:var(--sub);text-align:right}
.note{color:var(--sub);font-size:12.5px;line-height:1.55;margin:0}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:3px 4px;text-align:left;border-bottom:1px solid var(--line)}
td:last-child{font-family:var(--num);text-align:right;color:var(--sub)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
</style>
</head>
<body>
<header>
  <h1>ROWAR 뽑기 연출 시험대</h1>
  <p>같은 캡슐이라도 등급이 높을수록 오래 · 크게 · 밝게. 캡슐이 열리기 전부터 색으로 등급을 슬쩍 보여 주고(기대감), 열리는 순간 터뜨립니다.</p>
  <a href="index.html">← 전투</a> <a href="growth.html">성장</a>
</header>
<div class="wrap">
  <main>
    <div class="stage" id="stage">
      <div class="cam" id="cam">
        <img class="bg" src="../../assets/backgrounds/gacha.webp" alt="">
        <div class="capsule" id="capsule"><img src="../../assets/gacha/core-capsule.png" alt="캡슐"></div>
        <img class="robot" id="robot" alt="">
      </div>
      <div class="tint" id="tint"></div>
      <canvas id="fx"></canvas>
      <div class="dim" id="dim"></div>
      <div class="flash" id="flash"></div>
      <div class="stamp" id="stamp"></div>
      <div class="card" id="card"><div class="r" id="cr"></div><div class="n" id="cn"></div><div class="s" id="cs"></div></div>
      <div class="row" id="row"></div>
      <div class="hud">연출 <b id="modeTxt">켬</b> · 최고 등급 <b id="bestTxt">—</b></div>
      <button class="go" id="go">▶ 뽑기</button>
    </div>
  </main>
  <aside>
    <section>
      <h2>뽑기</h2>
      <div class="seg"><button class="b on" id="m1">단발</button><button class="b" id="m10">10연차</button></div>
    </section>
    <section>
      <h2>등급 미리 보기</h2>
      <div class="seg five" id="tiers"></div>
      <p class="note" style="margin-top:6px">누르면 그 등급이 나오는 연출을 바로 봅니다. "무작위"는 실제 확률대로입니다.</p>
      <button class="b" id="rand" style="width:100%;margin-top:6px">무작위 (실제 확률)</button>
    </section>
    <section>
      <h2>비교</h2>
      <div class="seg"><button class="b" id="vNow">지금 게임</button><button class="b on" id="vJuice">연출 켬</button></div>
    </section>
    <section>
      <h2>세기</h2>
      <div class="sl"><span>소리 크기</span><input type="range" id="vol" min="0" max="100" value="70"><output id="volOut">70%</output></div>
      <div class="sl" style="margin-top:8px"><span>소리</span><select id="sfxsrc" style="font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px"><option value="files">AI 생성 소리</option><option value="synth">합성음</option></select><span></span></div>
    </section>
    <section>
      <h2>실제 등급 분포 (기체)</h2>
      <table id="odds"></table>
    </section>
    <p class="note">기체 등급 가중치는 게임의 <code>ROBOT_RARITY</code> 표를 그대로 씁니다. 연출 길이는 일반 0.8초 → 에픽 약 5초로 늘어납니다.</p>
  </aside>
</div>
<script type="module" src="gacha.js?v=1008a"></script>
</body>
</html>
